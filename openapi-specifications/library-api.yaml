openapi: 3.1.0
info:
  title: Library API
  version: 1.0.0
  description: Teaching contract for a small library service.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /books:
    get:
      summary: List books
      operationId: listBooks
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of books
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
                  pagination:
                    type: object
                    required: [limit, offset, total]
                    properties:
                      limit: { type: integer }
                      offset: { type: integer }
                      total: { type: integer }
    post:
      summary: Create a book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, author]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                author: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Book created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /books/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      summary: Get a book
      operationId: getBook
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a book
      operationId: deleteBook
      responses:
        '204': { description: Book deleted }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    Book:
      type: object
      required: [id, title, author, createdAt]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string }
        author: { type: string }
        createdAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
